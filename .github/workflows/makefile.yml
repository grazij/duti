name: Makefile + Release CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # the changelog is generated from the commits since the last v* tag,
        # so the shallow default clone is not enough
        fetch-depth: 0

    - name: Install Autoconf
      run: brew install autoconf

    # Bumps the +grazij.N counter and writes CHANGELOG.md, but pushes
    # nothing. The version has to be settled before Configure, because
    # AC_INIT reads version.toml through m4_esyscmd_s at autoconf time.
    # If no release-worthy commit has landed, the bump is rolled back and
    # the rest of the release is skipped.
    - name: Prepare release
      id: release
      if: ${{ github.event_name == 'push' }}
      run: |
        set -euo pipefail
        version=$(./bump-fork-version.sh)
        # exit 1 means "nothing to release"; anything else is a real failure
        # (e.g. exit 2, no v* tag and no baseline) and must not be swallowed
        set +e
        notes=$(./make-changelog.sh "$version")
        rc=$?
        set -e
        if [ "$rc" -eq 1 ]; then
          echo "no release-worthy commits since the last tag; skipping release"
          git checkout -- version.toml
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        elif [ "$rc" -ne 0 ]; then
          echo "make-changelog.sh failed with status $rc" >&2
          exit "$rc"
        fi
        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        {
          echo "notes<<__DUTI_EOF__"
          echo "$notes"
          echo "__DUTI_EOF__"
        } >> "$GITHUB_OUTPUT"

    # -f is required: autoreconf otherwise skips autoconf because configure
    # is newer than configure.ac, and the bumped version never reaches the
    # binary.
    - name: Configure
      run: autoreconf -if && ./configure

    - name: Build
      run: make

    - name: Verify build
      run: |
        set -euo pipefail
        ./duti -V
        lipo -archs duti
        vtool -show-build duti

    # only after the build has passed
    - name: Commit and tag
      if: ${{ github.event_name == 'push' && steps.release.outputs.released == 'true' }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add version.toml CHANGELOG.md
        # [skip ci] keeps this push from retriggering the workflow
        git commit -m "chore(release): ${{ steps.release.outputs.version }} [skip ci]"
        git tag "v${{ steps.release.outputs.version }}"
        git push origin HEAD:master
        git push origin "v${{ steps.release.outputs.version }}"

    - name: GitHub Release
      uses: softprops/action-gh-release@v2
      if: ${{ github.event_name == 'push' && steps.release.outputs.released == 'true' }}
      with:
        tag_name: v${{ steps.release.outputs.version }}
        body: ${{ steps.release.outputs.notes }}
